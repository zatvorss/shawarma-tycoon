<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <title>{{{ PRODUCT_NAME }}}</title>
  <!-- SDK Яндекс Игр: подключение строго по документации -->
  <script src="/sdk.js"></script>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #120B07;
      /* нет прокрутки, swipe-to-refresh, выделения и меню по долгому тапу */
      touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: rgba(0,0,0,0);
    }
    #unity-canvas {
      position: fixed; left: 0; top: 0; width: 100%; height: 100%;
      display: block; outline: none; background: #120B07;
    }
    #loader {
      position: fixed; left: 50%; top: 50%; width: 46%; max-width: 520px; height: 14px;
      margin-left: -23%; margin-top: -7px; border-radius: 7px; background: rgba(255,255,255,0.12);
      overflow: hidden;
    }
    @media (min-width: 1130px) { #loader { margin-left: -260px; } }
    #fill { width: 0; height: 100%; border-radius: 7px; background: #FFC928; transition: width 0.2s; }
  </style>
</head>
<body oncontextmenu="return false;">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader"><div id="fill"></div></div>
  <script>
    // --- ответы из SDK в Unity (объект YandexBridge) ---
    window.unityInstance = null;
    window.ygPending = [];
    window.ygSend = function (method, arg) {
      arg = (arg === undefined || arg === null) ? "" : String(arg);
      if (window.unityInstance) window.unityInstance.SendMessage("YandexBridge", method, arg);
      else window.ygPending.push([method, arg]);
    };

    // --- SDK Яндекс Игр ---
    window.ysdk = null;
    window.ygFailed = false;
    if (typeof YaGames !== "undefined") {
      YaGames.init().then(function (sdk) {
        window.ysdk = sdk;
        // пауза/возобновление от площадки (оверлеи, меню Яндекса)
        try {
          sdk.on("game_api_pause", function () { window.ygSend("OnApiPause", ""); });
          sdk.on("game_api_resume", function () { window.ygSend("OnApiResume", ""); });
        } catch (e) {}
      }).catch(function () { window.ygFailed = true; });
    } else {
      window.ygFailed = true;
    }

    // --- запрет контекстного меню, выделения и прокрутки страницы ---
    document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    document.addEventListener("selectstart", function (e) { e.preventDefault(); });
    document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
    window.addEventListener("keydown", function (e) {
      var k = e.keyCode;
      if (k === 32 || k === 37 || k === 38 || k === 39 || k === 40) e.preventDefault();
    });

    // --- загрузка Unity ---
    var canvas = document.querySelector("#unity-canvas");
    var fill = document.querySelector("#fill");
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      showBanner: function () {}   // без системных баннеров Unity (в т.ч. «WebGL на мобильных»)
    };
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    }
    var script = document.createElement("script");
    script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        fill.style.width = (100 * p) + "%";
      }).then(function (instance) {
        window.unityInstance = instance;
        var l = document.querySelector("#loader");
        if (l) l.parentNode.removeChild(l);
        var q = window.ygPending; window.ygPending = [];
        for (var i = 0; i < q.length; i++) instance.SendMessage("YandexBridge", q[i][0], q[i][1]);
      }).catch(function (message) { console.error(message); });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
